<svg xmlns="http://w3.org" viewBox="0 0 1000 40" width="100%" height="40">
  <defs>
    <linearGradient id="b" x2="0" y2="100%">
      <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="a">
      <rect width="180" height="28" rx="4" fill="#fff"/>
    </clipPath>
  </defs>
  <style>
    @keyframes scroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-950px); }
    }
    .marquee-container {
      animation: scroll 20s linear infinite;
    }
    .marquee-container:hover {
      animation-play-state: paused;
    }
    .badge {
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
  <g class="marquee-container">
    <g transform="translate(0,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#232f3e"/><rect width="180" height="28" fill="url(#b)"/>
      <text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">AWS CERTIFIED</text>
    </g>
    <g transform="translate(195,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#008cc1"/><rect width="180" height="28" fill="url(#b)"/>
      <text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">NEO4J PROFESSIONAL</text>
    </g>
    <g transform="translate(390,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#29b5e8"/><rect width="180" height="28" fill="url(#b)"/>
      <text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">SNOWPRO CORE</text>
    </g>
    <g transform="translate(585,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#ff9900"/><rect width="180" height="28" fill="url(#b)"/>
      <text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">DATA ENGINEER</text>
    </g>
    <g transform="translate(780,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#111111"/><rect width="180" height="28" fill="url(#b)"/>
      <text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">AI / ML ENGINEER</text>
    </g>
    <!-- Loop Duplicates -->
    <g transform="translate(975,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#232f3e"/><text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">AWS CERTIFIED</text>
    </g>
    <g transform="translate(1170,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#008cc1"/><text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">NEO4J PROFESSIONAL</text>
    </g>
    <g transform="translate(1365,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#29b5e8"/><text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">SNOWPRO CORE</text>
    </g>
    <g transform="translate(1560,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#ff9900"/><text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">DATA ENGINEER</text>
    </g>
    <g transform="translate(1755,6)" clip-path="url(#a)">
      <rect width="180" height="28" fill="#111111"/><text x="90" y="18" fill="#fff" class="badge" text-anchor="middle">AI / ML ENGINEER</text>
    </g>
  </g>
</svg>
